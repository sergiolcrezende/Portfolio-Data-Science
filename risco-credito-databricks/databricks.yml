bundle:
  name: risco-credito-databricks

include:
  - resources/*.yml

variables:
  catalog:
    description: "Catálogo Unity Catalog usado por este ambiente"

targets:
  dev:
    default: true
    workspace:
      host: ${var.databricks_host}
    variables:
      catalog: credito_dev

  hml:
    workspace:
      host: ${var.databricks_host}
    variables:
      catalog: credito_hml

  prd:
    workspace:
      host: ${var.databricks_host}
    variables:
      catalog: credito_prd
